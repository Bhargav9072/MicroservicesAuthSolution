name: Deploy AuthService

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'src/AuthService/**'
      - 'src/Shared/**'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore src/AuthService/AuthService.csproj

      - run: dotnet build src/AuthService/AuthService.csproj -c Release --no-restore

      - run: dotnet publish src/AuthService/AuthService.csproj -c Release -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ms-auth-api
          publish-profile: ${{ secrets.AUTH_PUBLISH_PROFILE }}
          package: publish
